name: Build Kivy APK with Buildozer

on:
  push:
    branches: [ "main" ] # سيبدأ البناء تلقائياً عند التحديث على فرع main
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً من موقع جيت هاب

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # تثبيت الاعتمادات والأدوات اللازمة لتشغيل Buildozer على سيرفر لينكس
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache git libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav libgstreamer-plugins-base1.0-dev libasound2-dev libjack-jackd2-dev
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    # إعداد التخزين المؤقت (Cache) لتسريع عمليات البناء القادمة
    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('**/buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    # بدء عملية البناء الفصيلية للتطبيق بصيغة Debug (للتجربة)
    - name: Build APK with Buildozer
      run: |
        cd finance_apk
        buildozer android debug

    # رفع ملف الـ APK الناتج ليكون جاهزاً للتحميل
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: finance-app-apk
        path: finance_apk/.buildozer/android/platform/build-armeabi-v7a_arm64-v8a/dists/*/build/outputs/apk/debug/*.apk
        name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build
      run: |
        npm install
        npx webpack
